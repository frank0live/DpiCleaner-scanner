[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpicleaner-scanner"
version = "2.0.0"
description = "Clean-IP finder and REALITY/SNI validator for Xray/V2Ray — desktop app + headless CLI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "frank0live" }]
keywords = ["xray", "v2ray", "vless", "reality", "sni", "clean-ip", "dpi"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["curl_cffi>=0.7"]

[project.scripts]
dpicleaner = "dpicleaner.__main__:main"

[project.urls]
Homepage = "https://github.com/frank0live/DpiCleaner-scanner"

[tool.setuptools.packages.find]
include = ["dpicleaner*"]
